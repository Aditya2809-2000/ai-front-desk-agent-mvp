<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 24px; background: #f6f7f9; color: #1a1d21; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  .notice { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-size: 12px;
    border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
  .metrics { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .metric { background: white; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 12px 16px; min-width: 130px; }
  .metric .num { font-size: 22px; font-weight: 600; }
  .metric .label { font-size: 12px; color: #6b7280; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px;
    overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
  th { background: #fafbfc; color: #6b7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  tr.needs-review { background: #fffbeb; }
  tr.needs-staff { background: #fef2f2; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .status.pending, .status.processing { background: #e5e7eb; color: #374151; }
  .status.contacted, .status.reminder_sent { background: #dbeafe; color: #1e40af; }
  .status.replied { background: #d1fae5; color: #065f46; }
  .status.booked { background: #ede9fe; color: #5b21b6; }
  .status.escalated { background: #fee2e2; color: #991b1b; }
  .status.closed { background: #f3f4f6; color: #6b7280; }
  .draft-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 8px; margin-top: 6px; white-space: pre-wrap; }
  .log-box { max-height: 90px; overflow-y: auto; white-space: pre-wrap; color: #4b5563; font-size: 12px; margin-top: 4px; }
  button { background: #111827; color: white; border: none; border-radius: 6px; padding: 6px 12px;
    font-size: 12px; cursor: pointer; margin-top: 6px; }
  button:disabled { background: #9ca3af; cursor: default; }
  button.secondary { background: transparent; color: #374151; border: 1px solid #d1d5db; }
  .empty { padding: 40px; text-align: center; color: #6b7280; }
  .refresh { float: right; }
</style>

<h1><?= businessName ?> — Patient Dashboard <button class="secondary refresh" onclick="load()">Refresh</button></h1>
<div class="sub">Approval queue for AI-drafted scheduling replies. Nothing is sent to a patient until you click Approve &amp; Send.</div>
<div class="notice">Logistics only: this dashboard never shows clinical/diagnostic data. Any message flagged as clinical is escalated to staff with no AI draft.</div>

<div class="metrics" id="metrics"></div>
<div id="content">Loading…</div>

<script>
  function load() {
    document.getElementById('content').innerText = 'Loading…';
    google.script.run.withSuccessHandler(render).withFailureHandler(function(err){
      document.getElementById('content').innerText = 'Error: ' + err.message;
    }).getDashboardData();
  }

  function render(data) {
    var m = data.metrics;
    var metricsHtml =
      '<div class="metric"><div class="num">' + m.total + '</div><div class="label">Total intakes</div></div>' +
      '<div class="metric"><div class="num">' + (m.statusCounts.escalated || 0) + '</div><div class="label">Needs staff</div></div>' +
      '<div class="metric"><div class="num">' + (m.statusCounts.booked || 0) + '</div><div class="label">Booked</div></div>' +
      '<div class="metric"><div class="num">' + (m.avgResponseTimeSeconds != null ? m.avgResponseTimeSeconds + 's' : '—') + '</div><div class="label">Avg first-response time</div></div>';
    document.getElementById('metrics').innerHTML = metricsHtml;

    if (!data.rows.length) {
      document.getElementById('content').innerHTML = '<div class="empty">No intakes yet. Submit the intake form to test the flow.</div>';
      return;
    }

    var rows = data.rows.map(function(r) {
      var needsReview = !!r.aiDraftReply;
      var needsStaff = r.status === 'escalated';
      var draftHtml = needsReview
        ? '<div class="draft-box">' + escapeHtml(r.aiDraftReply) + '</div>' +
          '<button onclick="approve(' + r.row + ', this)">Approve &amp; Send</button>'
        : (needsStaff ? '<span style="color:#991b1b;font-weight:600;">Call patient — no AI draft (escalated)</span>' : '');
      var logHtml = r.conversationLog ? '<div class="log-box">' + escapeHtml(r.conversationLog) + '</div>' : '';

      return '<tr class="' + (needsReview ? 'needs-review' : (needsStaff ? 'needs-staff' : '')) + '">' +
        '<td><strong>' + escapeHtml(r.name || '') + '</strong><br><span style="color:#6b7280">' + r.phone + '</span></td>' +
        '<td>' + escapeHtml(r.reasonForVisit || '') + '<br><span style="color:#6b7280">' + escapeHtml(r.preferredWindow || '') + '</span></td>' +
        '<td><span class="status ' + r.status + '">' + r.status.replace('_',' ') + '</span></td>' +
        '<td>' + r.lastContactAt + '</td>' +
        '<td>' + r.nextActionAt + '</td>' +
        '<td>' + draftHtml + logHtml + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('content').innerHTML =
      '<table><thead><tr>' +
      '<th>Patient</th><th>Reason / Window</th><th>Status</th><th>Last contact</th><th>Next action</th><th>Draft reply / log</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function approve(row, btn) {
    btn.disabled = true;
    btn.innerText = 'Sending…';
    google.script.run.withSuccessHandler(function() {
      load();
    }).withFailureHandler(function(err) {
      alert('Send failed: ' + err.message);
      btn.disabled = false;
      btn.innerText = 'Approve & Send';
    }).sendApprovedReply(row);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  load();
</script>
